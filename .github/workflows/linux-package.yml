name: Handy Linux package
on: workflow_dispatch
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev libevdev-dev libasound2-dev pkg-config libssl-dev libvulkan-dev glslc spirv-headers glslang-tools libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libgtk-layer-shell-dev libopenblas-dev patchelf cmake
      - run: bun install --frozen-lockfile
      - run: bun run tauri build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: handy-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
